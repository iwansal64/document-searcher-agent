[package]
name = "document-searcher-agent-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.15.0", features = ["cookies"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.0", features = ["serde"] }
cookie = "0.16"
actix-web-httpauth = "0.8.2"
